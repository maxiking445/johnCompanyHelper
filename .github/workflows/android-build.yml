name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version label (for example v0.1.2)
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.7.2
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        run: |
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Expected a version such as v0.1.2'; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - name: Configure isolated CI export
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          settings = pathlib.Path.home() / '.config/godot/editor_settings-4.7.tres'
          settings.parent.mkdir(parents=True, exist_ok=True)
          settings.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
              + 'export/android/java_sdk_path = ' + json.dumps(os.environ['JAVA_HOME']) + '\n'
              + 'export/android/android_sdk_path = ' + json.dumps(os.environ['ANDROID_HOME']) + '\n')
          preset = pathlib.Path('export_presets.cfg')
          text = preset.read_text()
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          major, minor, patch = map(int, version.split('.'))
          if minor >= 1000 or patch >= 1000:
              raise SystemExit('Minor and patch versions must be below 1000')
          code = major * 1000000 + minor * 1000 + patch
          if not 1 <= code <= 2100000000:
              raise SystemExit('Android version code out of range')
          text = re.sub(r'^version/name=.*$', 'version/name=' + json.dumps(version), text, flags=re.M)
          text = re.sub(r'^version/code=.*$', f'version/code={code}', text, flags=re.M)
          text = re.sub(r'^architectures/x86_64=.*$', 'architectures/x86_64=true', text, flags=re.M)
          # Sign explicitly after export, using a temporary debug key.
          text = re.sub(r'^package/signed=.*$', 'package/signed=false', text, flags=re.M)
          preset.write_text(text)
          project = pathlib.Path('project.godot')
          project_text = project.read_text()
          if 'renderer/rendering_method.mobile=' not in project_text:
              project_text = project_text.replace('[rendering]\n', '[rendering]\n\nrenderer/rendering_method.mobile="gl_compatibility"\n', 1)
          project.write_text(project_text)
          # Editor-only MCP runtime must not reference an excluded addon in the APK.
          project.write_text(re.sub(r'^_mcp_game_helper=.*\n', '', project.read_text(), flags=re.M))
          PY
      - name: Import and export release APK
        run: |
          godot --headless --path . --import --quit
          mkdir -p build/android
          godot --headless --path . --export-release Android "$RUNNER_TEMP/unsigned.apk"
          test -s "$RUNNER_TEMP/unsigned.apk"
      - name: Debug-sign and verify APK
        run: |
          umask 077
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000
          tools="$ANDROID_HOME/build-tools/35.0.1"
          output="build/android/JohnCompanyHelper-${RELEASE_TAG}-android.apk"
          "$tools/zipalign" -P 16 -f 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/debug.keystore" \
            --ks-key-alias androiddebugkey --ks-pass pass:android \
            --key-pass pass:android --out "$output" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose "$output"
          "$tools/zipalign" -c -P 16 4 "$output"
      - name: Remove signing material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/debug.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.release_tag }}
          path: build/android/*.apk
          if-no-files-found: error
